name: Deploy to Production

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # --- Calcular prefijo de imagen en lowercase ---
      - name: Set image prefix (lowercase)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # --- Validación de secretos ---
      - name: Validate required secrets
        run: |
          missing=""
          [ -z "${{ secrets.VPS_HOST }}" ] && missing="$missing VPS_HOST"
          [ -z "${{ secrets.VPS_USER }}" ] && missing="$missing VPS_USER"
          [ -z "${{ secrets.VPS_SSH_KEY }}" ] && missing="$missing VPS_SSH_KEY"
          [ -z "${{ secrets.VPS_DEPLOY_PATH }}" ] && missing="$missing VPS_DEPLOY_PATH"
          [ -z "${{ secrets.TS_OAUTH_CLIENT_ID }}" ] && missing="$missing TS_OAUTH_CLIENT_ID"
          [ -z "${{ secrets.TS_OAUTH_SECRET }}" ] && missing="$missing TS_OAUTH_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi

      # --- Checkout ---
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Tailscale VPN ---
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # --- Docker setup ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Build & Push Backend ---
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Build & Push Frontend ---
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Sync config files to VPS ---
      - name: Sync nginx config to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 5042
          source: "nginx/nginx-prod.conf"
          target: ${{ secrets.VPS_DEPLOY_PATH }}
          strip_components: 0

      - name: Sync docker-compose.prod.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 5042
          source: "docker-compose.prod.yml"
          target: ${{ secrets.VPS_DEPLOY_PATH }}
          strip_components: 0

      # --- Deploy via SSH ---
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 5042
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            cp docker-compose.prod.yml docker-compose.yml
            
            # Asegura la existencia de la red proxy_net
            docker network inspect proxy_net >/dev/null 2>&1 || docker network create proxy_net

            docker compose pull
            docker compose up -d
            docker image prune -f

      # --- Post-deploy health check ---
      - name: Verify deployment health
        uses: appleboy/ssh-action@v1
        continue-on-error: true
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 5042
          script: |
            echo "Waiting for services to stabilize..."
            sleep 15
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/ || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed (HTTP $HTTP_CODE)"
            else
              echo "⚠️ Health check returned HTTP $HTTP_CODE — services may still be starting"
            fi
