# =============================================================================
# nginx-prod.conf — Configuración de Producción para adm_taxis
# =============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Rendimiento ---
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # --- Compresión Gzip (Ideal para APIs y SPAs) ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # --- Rate Limiting (Protección contra spam en la API) ---
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # --- Cabeceras de Seguridad ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Upstreams (Tus contenedores internos) ---
    upstream backend  { server backend:8000; }
    upstream frontend { server frontend:80; }

    server {
        listen 80;
        server_name _;

        # Tamaño máximo de archivos (ej. si luego subes fotos de los taxis)
        client_max_body_size 10m;

        # ==================================================================
        # Backend: Rutas de la API (Sin rewrite, FastAPI recibe la ruta con /api/)
        # ==================================================================
        location /api/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================================================================
        # Backend: Documentación de FastAPI (Swagger UI / ReDoc)
        # ==================================================================
        location /docs {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
        }
        location /openapi.json {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
        }

        # ==================================================================
        # Backend: WebSockets (Preparado para tracking en tiempo real)
        # ==================================================================
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
        }

        # ==================================================================
        # Frontend: Caché agresivo para Assets Estáticos (CSS, JS, Imágenes)
        # ==================================================================
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ==================================================================
        # Frontend: Enrutamiento general (SPA)
        # ==================================================================
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}